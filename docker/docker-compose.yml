services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scms-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in docker/.env}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: scms-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SportsCenter=Server=sqlserver,1433;Database=SportsCenterManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in docker/.env};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Database__BaselineLegacySchema=${DATABASE_BASELINE_LEGACY_SCHEMA:-false}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in docker/.env}
      - Jwt__Issuer=SportsCenterManagement.API
      - Jwt__Audience=SportsCenterManagement.FE
      - Jwt__ExpiresMinutes=60
      - Bootstrap__SystemAdmin__Username=${ADMIN_USERNAME:?Set ADMIN_USERNAME in docker/.env}
      - Bootstrap__SystemAdmin__Email=${ADMIN_EMAIL:?Set ADMIN_EMAIL in docker/.env}
      - Bootstrap__SystemAdmin__Password=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3004}
      - Cors__AllowedOrigins__1=http://localhost:3004
      - Cors__AllowedOrigins__2=http://localhost:5173
      - ExternalCommunications__Email__WebhookUrl=
      - ExternalCommunications__Email__Smtp__Host=${EMAIL_SMTP_HOST:-}
      - ExternalCommunications__Email__Smtp__Port=${EMAIL_SMTP_PORT:-587}
      - ExternalCommunications__Email__Smtp__EnableSsl=${EMAIL_SMTP_ENABLE_SSL:-true}
      - ExternalCommunications__Email__Smtp__From=${EMAIL_SMTP_FROM:-}
      - ExternalCommunications__Email__Smtp__Username=${EMAIL_SMTP_USERNAME:-}
      - ExternalCommunications__Email__Smtp__Password=${EMAIL_SMTP_PASSWORD:-}
      - MailSettings__Mail=${EMAIL_SMTP_FROM:-}
      - MailSettings__DisplayName=Hệ Thống SCMS
      - MailSettings__Password=${EMAIL_SMTP_PASSWORD:-}
      - MailSettings__Host=${EMAIL_SMTP_HOST:-}
      - MailSettings__Port=${EMAIL_SMTP_PORT:-587}
    volumes:
      - backend_media:/app/App_Data/media

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: scms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3004}:80"

volumes:
  sqlserver_data:
    name: scms_sqlserver_data
  backend_media:
    name: scms_backend_media
