version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scms-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Password123}
      - MSSQL_PID=Developer
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./Backend/Backend
      dockerfile: Dockerfile
    container_name: scms-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SportsCenter=Server=sqlserver,1433;Database=SportsCenterManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password123};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Database__BaselineLegacySchema=true
      - Jwt__Key=${JWT_KEY:-SCMS_Secret_Key_For_JWT_Authentication_SportsCenter_2026_Secure!}
      - Jwt__Issuer=SportsCenterManagement.API
      - Jwt__Audience=SportsCenterManagement.FE
      - Jwt__ExpiresMinutes=60
      - Bootstrap__Admin__Username=${ADMIN_USERNAME:-admin}
      - Bootstrap__Admin__Email=${ADMIN_EMAIL:-admin@sportscenter.vn}
      - Bootstrap__Admin__Password=${ADMIN_PASSWORD:-Admin@SCMS2026!Secure}
      - Cors__AllowedOrigins__0=http://localhost:3004
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Cors__AllowedOrigins__2=http://localhost:5000
      - Cors__AllowedOrigins__3=http://localhost:80
    volumes:
      - backend_media:/app/App_Data/media

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: scms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3004}:80"

volumes:
  sqlserver_data:
    name: scms_sqlserver_data
  backend_media:
    name: scms_backend_media