<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261103v1" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261103v1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261103v1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261103v1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261103v1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261103v1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Olympic Sports Arena</title>
    
    <!-- Google Fonts: Archivo (titles, figures) + Be Vietnam Pro (text). Both carry full Vietnamese diacritics. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Text fonts use display=swap, so load them without blocking the app script. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"></noscript>
    
    <!-- Google Material Symbols & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <!-- Pre-mount Theme Detection -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('SCMS_THEME_MODE');
          if (mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  </head>
  <body class="bg-[#FAF8F5] dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-[#81B29A] selection:text-white">

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
