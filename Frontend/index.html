<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCMS - Sports Center Management System | Chuẩn Olympic</title>
    
    <!-- Google Fonts: Lexend & Inter (Tối ưu font-display: swap và các trọng số thực tế) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Lexend', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              lexend: ['Lexend', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              chivo: ['Lexend', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              inter: ['Lexend', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" href="/src/styles/theme.css">
  </head>
  <body class="bg-slate-50 text-slate-900 font-lexend antialiased selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
