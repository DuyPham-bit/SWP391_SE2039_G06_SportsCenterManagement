<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261103v1" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261103v1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261103v1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261103v1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261103v1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261103v1" />
    <script>
      (function() {
        try {
          var t = Date.now();
          var icons = document.querySelectorAll("link[rel*='icon']");
          icons.forEach(function(el) {
            var raw = el.href.split('?')[0];
            el.href = raw + '?v=' + t;
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Olympic Sports Arena</title>
    
    <!-- Google Fonts: Inter & Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols & Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    
    <!-- Pre-mount Theme Detection -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('SCMS_THEME_MODE');
          if (mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              fpt: {
                blue: '#1A3B8B',
                'blue-light': '#EBF2FC',
                'blue-hover': '#142F70',
                orange: '#F26522',
                green: '#008744'
              }
            },
            fontFamily: {
              sans: ['Inter', 'Lexend', 'system-ui', '-apple-system', 'sans-serif'],
              lexend: ['Inter', 'Lexend', 'system-ui', '-apple-system', 'sans-serif'],
              chivo: ['Inter', 'Lexend', 'system-ui', '-apple-system', 'sans-serif'],
              inter: ['Inter', 'Lexend', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" href="/src/styles/theme.css">
  </head>
  <body class="bg-[#FAF8F5] dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-[#81B29A] selection:text-white">

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
